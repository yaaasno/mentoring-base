<div style="width: 200px; height: 200px; margin-top: 50px;">
  <p>{{ user.name | customUpperCase }}</p>
  <p>{{ user.email | customUpperCase }}</p>
  <p>{{ user.website | customUpperCase }}</p>
  <p>{{ user.company.name }}</p>
  <button (click)=onDeleteUser(user.id)>Удалить юзера</button>
  <button (click)=openDialog()>Редактировать юзера</button>
</div>
