<div class="div">
  <p red>{{ user.name | customUpperCase }}</p>
  <p red>{{ user.email | customUpperCase }}</p>
  <p red>{{ user.website | customUpperCase }}</p>
  <p red>{{ user.company.name }}</p>
  <p red>{{ (user.phone?.toString() ?? '') | customRemoveDashes }}</p>
  <button mat-button="elevated" (click)=onDeleteUser(user.id)>Удалить</button>
  <button mat-button="elevated" (click)=openDialog()>Редактировать</button>
</div>
