<h2 mat-dialog-title>Подтвердите действие</h2>
  <mat-dialog-content>Вы уверены, что хотите удалить?</mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button [mat-dialog-close]="false">Отмена</button>
    <button (click)="openSnackBar()" mat-button [mat-dialog-close]="true">Удалить</button>
  </mat-dialog-actions>
