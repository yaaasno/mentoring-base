<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{todo.title}}</mat-card-title>
    <mat-card-title>{{todo.userId}}</mat-card-title>
    <mat-card-title> {{todo.completed ? 'ДА' : 'НЕТ'}}</mat-card-title>
  </mat-card-header>
  <mat-card-actions>
    <button (click)=onDeleteTodo(todo.id)>Удалить Задачу</button>
  </mat-card-actions>
</mat-card>
