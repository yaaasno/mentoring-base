<h1 style="margin-top: 50px;">КОМПОНЕНТ СПИСКА ЗАДАЧ</h1>

<app-create-todos-form (createTodo)="createTodo($event)"></app-create-todos-form>
<div style="display: flex; width: 100%; flex-wrap: wrap; gap: 20px">
  <div *ngFor="let todo of todosService.todos$ | async">
    <app-todo-card [todo]="todo" (deleteTodo)="deleteTodo($event)"></app-todo-card>
  </div>
</div>
