<h1>Дата {{today | date:'medium'}}</h1>
<button yellow class="btn">Пусто</button>
<app-create-todos-form (createTodos)="createTodo($event)"></app-create-todos-form>
<div class="todo-form">
  <div *ngFor="let todo of todos$ | async">
    <app-todo-card [todo]="todo" (deleteTodo)="deleteTodo($event)"></app-todo-card>
  </div>
</div>
